# Render Blueprint: リポジトリ接続後 "New + > Blueprint" でこの設定が使われる
services:
  - type: web
    name: visionone-beta
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: VISIONONE_HOST
        value: 0.0.0.0
      - key: VISIONONE_PORT
        value: 8787
      - key: VISIONONE_BASIC_USER
        sync: false
      - key: VISIONONE_BASIC_PASSWORD
        sync: false
      - key: VISIONONE_LLM_URL
        sync: false
      - key: VISIONONE_LLM_API_KEY
        sync: false
