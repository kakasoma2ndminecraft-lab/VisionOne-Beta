# Fly.io: `fly launch` でこの設定が使われる(nrt=東京リージョン)
app = "visionone-beta"
primary_region = "nrt"

[build]

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250
