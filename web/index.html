<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>otomo — チーム型パーソナルエージェント</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel2: #1e222b; --text: #e8eaf0;
    --muted: #8b93a7; --accent: #5b8cff; --bubble: #242a36; --mine: #2b5fd9;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Hiragino Sans", "Noto Sans JP", sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; }
  aside { width: 240px; background: var(--panel); padding: 16px; display: flex; flex-direction: column; gap: 8px; border-right: 1px solid #262b36; }
  aside h1 { font-size: 16px; margin: 0 0 4px; }
  aside h2 { font-size: 11px; color: var(--muted); margin: 12px 0 4px; text-transform: uppercase; letter-spacing: .08em; }
  .member { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 8px; background: var(--panel2); font-size: 13px; }
  .member .em { font-size: 16px; }
  .member small { color: var(--muted); display: block; font-size: 10px; }
  #threads { flex: 1; overflow-y: auto; }
  .thread-btn { width: 100%; text-align: left; background: none; border: none; color: var(--text); padding: 8px; border-radius: 8px; cursor: pointer; font-size: 13px; }
  .thread-btn:hover { background: var(--panel2); }
  .thread-btn.active { background: var(--panel2); color: var(--accent); }
  button.new-thread { background: var(--accent); color: white; border: none; padding: 8px; border-radius: 8px; cursor: pointer; font-size: 13px; }
  main { flex: 1; display: flex; flex-direction: column; }
  header { padding: 12px 20px; border-bottom: 1px solid #262b36; font-size: 14px; color: var(--muted); display: flex; justify-content: space-between; }
  header .cls { color: var(--text); font-weight: 600; }
  #log { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 70%; padding: 10px 14px; border-radius: 16px; background: var(--bubble); font-size: 14px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
  .msg .who { font-size: 11px; color: var(--muted); margin-bottom: 2px; }
  .msg.user { align-self: flex-end; background: var(--mine); }
  .msg.bot { align-self: flex-start; }
  .rxn { font-size: 12px; color: var(--muted); align-self: flex-start; }
  .rxn.user { align-self: flex-end; }
  .react-row { display: flex; gap: 6px; align-self: flex-start; }
  .react-row.user { align-self: flex-end; }
  .react-btn { background: none; border: 1px solid #333a49; border-radius: 999px; padding: 2px 8px; cursor: pointer; font-size: 12px; color: var(--muted); }
  .react-btn:hover { border-color: var(--accent); color: var(--text); }
  form { display: flex; gap: 8px; padding: 14px 20px; border-top: 1px solid #262b36; }
  input[type=text] { flex: 1; background: var(--panel2); border: 1px solid #2b3242; color: var(--text); border-radius: 999px; padding: 10px 16px; font-size: 14px; outline: none; }
  input[type=text]:focus { border-color: var(--accent); }
  form button { background: var(--accent); color: white; border: none; border-radius: 999px; padding: 10px 20px; cursor: pointer; font-size: 14px; }
  .hint { color: var(--muted); font-size: 11px; padding: 0 20px 8px; }
</style>
</head>
<body>
<aside>
  <h1>🛰 otomo</h1>
  <h2>Team</h2>
  <div id="members"></div>
  <h2>Threads</h2>
  <div id="threads"></div>
  <button class="new-thread" id="newThread">＋ 新しいスレッド</button>
  <h2>Cookie Login</h2>
  <input id="cookieHost" type="text" placeholder="example.com" style="width:100%;margin-bottom:4px;background:var(--panel2);border:1px solid #2b3242;color:var(--text);border-radius:6px;padding:6px;font-size:12px" />
  <input id="cookieData" type="text" placeholder="k=v; k2=v2" style="width:100%;margin-bottom:4px;background:var(--panel2);border:1px solid #2b3242;color:var(--text);border-radius:6px;padding:6px;font-size:12px" />
  <button class="new-thread" id="cookieBtn" style="font-size:12px">クッキー登録(自動ログイン)</button>
  <div id="cookieStatus" class="hint"></div>
</aside>
<main>
  <header><span class="cls" id="threadTitle">スレッドを選択</span><span id="threadChannel"></span></header>
  <div id="log"></div>
  <div class="hint">ヒント: 「調査して/予約して」でリーダーが委任します。@Sora @Ren で直接指名。</div>
  <form id="composer">
    <input id="input" type="text" placeholder="メッセージを入力…" autocomplete="off" />
    <button type="submit">送信</button>
  </form>
</main>
<script>
let current = null;
const emojis = ["👍","🫡","✅","🎉","🤔"];

async function api(path, body) {
  const res = await fetch(path, { method: "POST", headers: {"content-type":"application/json"}, body: JSON.stringify(body) });
  return res.json();
}

async function refresh() {
  const state = await (await fetch("/api/state")).json();
  const members = document.getElementById("members");
  members.innerHTML = "";
  const all = [state.team.leader, ...state.team.workers];
  for (const m of all) {
    const div = document.createElement("div");
    div.className = "member";
    div.innerHTML = `<span class="em">${m.emoji}</span><div>@${m.name}<small>${m.role}</small></div>`;
    members.appendChild(div);
  }
  const threads = document.getElementById("threads");
  threads.innerHTML = "";
  for (const t of state.threads) {
    const btn = document.createElement("button");
    btn.className = "thread-btn" + (current === t.id ? " active" : "");
    btn.textContent = `# ${t.title}`;
    btn.onclick = () => { current = t.id; refresh(); };
    threads.appendChild(btn);
  }
  if (!current && state.threads[0]) current = state.threads[0].id;
  renderThread(state);
}

function renderThread(state) {
  const log = document.getElementById("log");
  const t = state.threads.find((x) => x.id === current);
  document.getElementById("threadTitle").textContent = t ? `# ${t.title}` : "スレッドを選択";
  document.getElementById("threadChannel").textContent = t ? t.channel : "";
  log.innerHTML = "";
  if (!t) return;
  for (const m of t.messages) {
    const div = document.createElement("div");
    div.className = "msg " + m.role;
    div.innerHTML = `<div class="who">${m.name}</div>${escapeHtml(m.text)}`;
    log.appendChild(div);
    if (m.reactions.length) {
      const r = document.createElement("div");
      r.className = "rxn " + m.role;
      r.textContent = m.reactions.map((x) => `${x.emoji} by ${x.by}`).join("  ");
      log.appendChild(r);
    }
    const row = document.createElement("div");
    row.className = "react-row " + m.role;
    for (const e of emojis) {
      const b = document.createElement("button");
      b.className = "react-btn";
      b.textContent = e;
      b.onclick = () => api("/api/react", { threadId: t.id, messageId: m.id, emoji: e }).then(refresh);
      row.appendChild(b);
    }
    log.appendChild(row);
  }
  log.scrollTop = log.scrollHeight;
}

function escapeHtml(s) {
  return s.replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
}

document.getElementById("composer").onsubmit = async (e) => {
  e.preventDefault();
  const input = document.getElementById("input");
  const text = input.value.trim();
  if (!text) return;
  let threadId = current;
  if (!threadId) {
    threadId = "webchat:" + Date.now().toString(36);
    current = threadId;
  }
  await api("/api/messages", { threadId, text });
  input.value = "";
  refresh();
};

document.getElementById("newThread").onclick = () => {
  const name = prompt("スレッド名:", "新しいタスク");
  if (!name) return;
  current = "webchat:" + Date.now().toString(36);
  document.getElementById("threadTitle").textContent = "# " + name;
  api("/api/messages", { threadId: current, text: "（スレッド開始: " + name + "）" }).then(refresh);
};

document.getElementById("cookieBtn").onclick = async () => {
  const host = document.getElementById("cookieHost").value.trim();
  const cookies = document.getElementById("cookieData").value.trim();
  if (!host || !cookies) return;
  const r = await api("/api/cookies", { host, cookies });
  document.getElementById("cookieStatus").textContent = r.ok ? `✅ ${r.imported} cookies → ${host} 自動ログイン可` : "❌ " + r.error;
};

refresh();
setInterval(refresh, 1200);
</script>
</body>
</html>
